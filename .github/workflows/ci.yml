name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arcates_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ARC_TEST_DB_HOST: 127.0.0.1
      ARC_TEST_DB_PORT: 3306
      ARC_TEST_DB_NAME: arcates_test
      ARC_TEST_DB_USER: root
      ARC_TEST_DB_PASS: root
      NO_COLOR: 1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, fileinfo

      - name: MySQL hazır olana kadar bekle
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL zamanında hazır olmadı."
          exit 1

      - name: Tüm PHP dosyalarında sözdizimi kontrolü
        run: find . -type f -name "*.php" -not -path "./public/uploads/*" -print0 | xargs -0 -n1 php -l

      - name: Testler — atlanan test yasak
        id: php-tests
        shell: bash
        run: |
          set +e
          php tests/run.php | tee /tmp/arcates-tests.log
          test_status=${PIPESTATUS[0]}

          if grep -q "ATLANDI" /tmp/arcates-tests.log; then
            echo "CI ortamında atlanan test bulundu. Test veritabanı veya bağımlılık eksik." | tee -a /tmp/arcates-tests.log
            test_status=1
          fi

          {
            echo '## Arcates test çıktısı'
            echo '```text'
            cat /tmp/arcates-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Test çıktısını artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcates-test-output
          path: /tmp/arcates-tests.log
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: browser
    needs: test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arcates_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, fileinfo

      - name: Tarayıcı test yapılandırmasını oluştur
        shell: bash
        run: |
          cat > config/config.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'app' => [
                  'base_url' => 'http://127.0.0.1:8321',
                  'env' => 'local',
                  'debug' => false,
                  'timezone' => 'Europe/Istanbul',
                  'name' => 'Arcates Browser Test',
                  'admin_path' => 'panel',
              ],
              'db' => [
                  'host' => '127.0.0.1', 'port' => 3306, 'name' => 'arcates_browser',
                  'user' => 'root', 'pass' => 'root', 'charset' => 'utf8mb4',
              ],
              'lang' => ['default' => 'tr', 'available' => ['tr', 'en', 'de', 'ar']],
              'mail' => ['method' => 'log', 'from' => 'test@arcates.local', 'from_name' => 'Arcates Test', 'to' => 'test@arcates.local'],
              'security' => [
                  'session_name' => 'arcsid', 'session_idle' => 7200,
                  'login_max_tries' => 5, 'login_lock' => 900, 'password_min' => 10,
                  'form_max_hourly' => 5, 'form_min_seconds' => 3, 'cookie_secure' => false,
              ],
              'upload' => [
                  'max_size' => 5 * 1024 * 1024,
                  'allowed_ext' => ['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg', 'pdf'],
                  'variants' => ['thumb' => 320, 'medium' => 768, 'large' => 1600],
              ],
              'privacy' => ['submission_retention_days' => 730, 'visit_retention_days' => 90],
          ];
          PHP

      - name: Veritabanını ve başlangıç içeriğini hazırla
        shell: bash
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot arcates_browser < db/schema.sql
          php tools/seed_content.php
          touch storage/installed.lock

      - name: Chromium ve Playwright kur
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Gerçek tarayıcı denetimleri
        shell: bash
        run: |
          set -uo pipefail
          php -S 127.0.0.1:8321 -t public >/tmp/arcates-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8321/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8321/ >/dev/null; then
            cat /tmp/arcates-server.log
            exit 1
          fi

          browser_status=0
          set +e

          node tools/browser/animation-check.mjs | tee /tmp/arcates-browser.log
          animation_status=${PIPESTATUS[0]}
          if [ "$animation_status" -ne 0 ]; then browser_status=1; fi

          node tools/browser/design-check.mjs | tee -a /tmp/arcates-browser.log
          design_status=${PIPESTATUS[0]}
          if [ "$design_status" -ne 0 ]; then browser_status=1; fi

          node tools/browser/inner-pages-check.mjs | tee -a /tmp/arcates-browser.log
          inner_status=${PIPESTATUS[0]}
          if [ "$inner_status" -ne 0 ]; then browser_status=1; fi

          exit "$browser_status"

      - name: Tarayıcı çıktısını artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcates-browser-output
          path: |
            /tmp/arcates-browser.log
            /tmp/arcates-server.log
          if-no-files-found: warn
          retention-days: 7
